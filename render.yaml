services:
  - type: web
    name: tripgenie-api
    runtime: python
    rootDir: tripgenie-backend/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: tripgenie-frontend
    runtime: static
    rootDir: tripgenie-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: tripgenie-frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        sync: false
